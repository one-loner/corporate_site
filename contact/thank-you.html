<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5; URL=/">
    <title>Thank You | Staticdex</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at 20% 30%, #4c1f2d, #47494e);min-height:100vh;color:#f2e8f0;display:flex;justify-content:center;align-items:center}
        .card{background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);border-radius:28px;padding:2.5rem;text-align:center;border:1px solid #38bdf8;max-width:500px;margin:1rem;animation:fadeIn 0.5s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .checkmark{font-size:4rem;margin-bottom:1rem}
        h1{color:#38bdf8;margin-bottom:0.5rem;font-size:2rem}
        p{color:#94a3b8;margin-bottom:0.5rem;line-height:1.6}
        .redirect{color:#475569;font-size:0.8rem;margin-top:1rem}
        .home-link{display:inline-block;margin-top:1rem;color:#38bdf8;text-decoration:none}
        .home-link:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="card">
        <div class="checkmark">✓</div>
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully to the Staticdex team.</p>
        <p>We'll review your inquiry and respond within 24 hours.</p>
        <div class="redirect">Redirecting to home page...</div>
        <a href="/" class="home-link">← Return to home page</a>
    </div>
</body>
</html>
